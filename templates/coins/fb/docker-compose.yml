  fractalbitcoin:
    image: ghcr.io/mmfpsolutions/fractalbitcoin:latest
    container_name: fractalbitcoin
    network_mode: host
    stop_grace_period: 120s
    volumes:
      - /data/fractalbitcoin/data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
