  btc-core:
    image: ghcr.io/mmfpsolutions/bitcoin-core:latest
    container_name: btc-core
    network_mode: host
    stop_grace_period: 120s
    volumes:
      - /data/btc-core/data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
